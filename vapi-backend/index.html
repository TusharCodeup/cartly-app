<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartly — Voice-First Grocery List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Newsreader', serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    const BACKEND_URL = "http://localhost:4444";

    // Text-to-Speech (TTS) Engine — Agent Speaks Out Loud
    const speak = (text) => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      window.speechSynthesis.speak(utterance);
    };

    const CATEGORIES = [
      { id: "produce", label: "Produce", emoji: "🥦", tint: "bg-emerald-50 text-emerald-700", ring: "ring-emerald-100" },
      { id: "dairy", label: "Dairy", emoji: "🥛", tint: "bg-sky-50 text-sky-700", ring: "ring-sky-100" },
      { id: "bakery", label: "Bakery", emoji: "🍞", tint: "bg-amber-50 text-amber-700", ring: "ring-amber-100" },
      { id: "beverages", label: "Beverages", emoji: "🧃", tint: "bg-cyan-50 text-cyan-700", ring: "ring-cyan-100" },
      { id: "pantry", label: "Pantry", emoji: "🫙", tint: "bg-orange-50 text-orange-700", ring: "ring-orange-100" },
      { id: "snacks", label: "Snacks", emoji: "🍿", tint: "bg-rose-50 text-rose-700", ring: "ring-rose-100" },
      { id: "household", label: "Household", emoji: "🏠", tint: "bg-violet-50 text-violet-700", ring: "ring-violet-100" },
      { id: "meat", label: "Meat & Protein", emoji: "🥩", tint: "bg-red-50 text-red-700", ring: "ring-red-100" },
    ];

    const catMap = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));

    const PRODUCTS = [
      { id: "p1", name: "Organic Strawberries", category: "produce", price: 4.49, unit: "1 lb box", rating: 4.7, reviews: 812 },
      { id: "p2", name: "Avocados", category: "produce", price: 2.99, unit: "pack of 3", rating: 4.5, reviews: 431 },
      { id: "p3", name: "Baby Spinach", category: "produce", price: 3.29, unit: "5 oz bag", rating: 4.4, reviews: 265 },
      { id: "p4", name: "Whole Milk", category: "dairy", price: 3.79, unit: "1 gal", rating: 4.6, reviews: 998 },
      { id: "p5", name: "Oat Milk", category: "dairy", price: 4.99, unit: "64 fl oz", rating: 4.8, reviews: 540 },
      { id: "p6", name: "Greek Yogurt", category: "dairy", price: 5.49, unit: "32 oz tub", rating: 4.6, reviews: 322 },
      { id: "p7", name: "Sourdough Loaf", category: "bakery", price: 4.99, unit: "1 loaf", rating: 4.7, reviews: 210 },
      { id: "p8", name: "Everything Bagels", category: "bakery", price: 3.49, unit: "pack of 6", rating: 4.5, reviews: 176 },
      { id: "p9", name: "Sparkling Water", category: "beverages", price: 5.99, unit: "12-pack", rating: 4.6, reviews: 601 },
      { id: "p10", name: "Cold Brew Coffee", category: "beverages", price: 6.49, unit: "32 fl oz", rating: 4.4, reviews: 189 },
      { id: "p11", name: "Basmati Rice", category: "pantry", price: 7.99, unit: "5 lb bag", rating: 4.8, reviews: 733 },
      { id: "p12", name: "Extra Virgin Olive Oil", category: "pantry", price: 9.49, unit: "16.9 fl oz", rating: 4.7, reviews: 402 },
      { id: "p13", name: "Honey", category: "pantry", price: 6.29, unit: "12 oz jar", rating: 4.6, reviews: 288 },
      { id: "p14", name: "Baked Veggie Chips", category: "snacks", price: 3.99, unit: "8 oz bag", rating: 4.3, reviews: 154 },
      { id: "p15", name: "Mixed Nuts", category: "snacks", price: 8.99, unit: "16 oz jar", rating: 4.7, reviews: 267 },
      { id: "p16", name: "Dish Soap", category: "household", price: 3.29, unit: "16 fl oz", rating: 4.5, reviews: 341 },
      { id: "p17", name: "Paper Towels", category: "household", price: 12.99, unit: "pack of 6", rating: 4.6, reviews: 522 },
      { id: "p18", name: "Free-Range Chicken Breast", category: "meat", price: 9.99, unit: "1.5 lb", rating: 4.6, reviews: 298 },
      { id: "p19", name: "Wild Salmon Fillet", category: "meat", price: 13.49, unit: "1 lb", rating: 4.8, reviews: 176 },
      { id: "p20", name: "Extra-Firm Tofu", category: "meat", price: 2.79, unit: "14 oz", rating: 4.4, reviews: 122 },
    ];

    const byId = Object.fromEntries(PRODUCTS.map((p) => [p.id, p]));

    const SUGGESTIONS = [
      { kind: "replenish", title: "Running low on Sourdough Loaf", note: "You usually re-add this every 6–7 days", productId: "p7", iconName: "RefreshCw" },
      { kind: "seasonal", title: "Strawberries are in season", note: "Peak freshness through late August", productId: "p1", iconName: "Leaf" },
      { kind: "substitute", title: "Try Oat Milk instead of Whole Milk", note: "Dairy-free, similar texture", productId: "p5", iconName: "ArrowLeftRight" },
    ];

    function currency(n) {
      return `$${n.toFixed(2)}`;
    }

    function CartlyStorefront() {
      const [query, setQuery] = useState("");
      const [activeCategory, setActiveCategory] = useState("all");
      const [maxPrice, setMaxPrice] = useState(null);
      const [cart, setCart] = useState({}); // productId -> qty
      const [cartOpen, setCartOpen] = useState(false);
      const [voiceOpen, setVoiceOpen] = useState(false);
      const [voiceState, setVoiceState] = useState("idle"); // idle | listening | processing | done
      const [transcriptText, setTranscriptText] = useState("");
      const [agentResponseText, setAgentResponseText] = useState("");
      const [toast, setToast] = useState(null);
      const [backendConnected, setBackendConnected] = useState(false);
      const toastTimer = useRef(null);

      const showToast = (msg, speakMessage = true) => {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 3200);
        if (speakMessage) {
          speak(msg);
        }
      };

      // Sync backend items into local cart state
      const fetchBackendItems = async () => {
        try {
          const res = await fetch(`${BACKEND_URL}/list_items`, { method: "POST" });
          if (res.ok) {
            const data = await res.json();
            setBackendConnected(true);
            const newCart = {};
            (data.items || []).forEach(item => {
              const matched = PRODUCTS.find(p => p.name.toLowerCase() === item.itemName.toLowerCase());
              if (matched) {
                newCart[matched.id] = item.quantity;
              }
            });
            setCart(newCart);
          }
        } catch (e) {
          setBackendConnected(false);
        }
      };

      useEffect(() => {
        fetchBackendItems();
      }, []);

      // API Call: Add to Cartly FastAPI Backend
      const addToCart = async (id, qty = 1, label, speakSpoken = true) => {
        const prod = byId[id];
        const itemName = label || prod?.name || id;
        const cat = prod ? catMap[prod.category]?.label : "Other";
        const price = prod ? prod.price : null;
        const unit = prod ? prod.unit : "";

        // Optimistic UI update
        setCart((c) => ({ ...c, [id]: (c[id] || 0) + qty }));
        const responseMsg = `Added ${qty > 1 ? qty + ' ' : ''}${itemName} to your list`;
        showToast(responseMsg, speakSpoken);

        // Backend API sync
        try {
          await fetch(`${BACKEND_URL}/add_item`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              itemName: itemName,
              quantity: qty,
              unit: unit,
              category: cat,
              maxPrice: price
            })
          });
          fetchBackendItems();
        } catch (e) {
          console.warn("Backend sync offline, using local state");
        }
      };

      // API Call: Set Quantity / Remove
      const setQty = async (id, qty, speakSpoken = true) => {
        const prod = byId[id];
        const oldQty = cart[id] || 0;
        
        if (qty <= 0) {
          setCart((c) => {
            const next = { ...c };
            delete next[id];
            return next;
          });
          if (prod) {
            const msg = `Removed ${prod.name} from your shopping list`;
            showToast(msg, speakSpoken);
            try {
              await fetch(`${BACKEND_URL}/cancel_item`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ itemName: prod.name })
              });
            } catch (e) {}
          }
        } else {
          setCart((c) => ({ ...c, [id]: qty }));
          if (prod) {
            const diff = qty - oldQty;
            const msg = `Updated quantity for ${prod.name} to ${qty}`;
            showToast(msg, speakSpoken);
            try {
              await fetch(`${BACKEND_URL}/add_item`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  itemName: prod.name,
                  quantity: diff > 0 ? diff : 1,
                  unit: prod.unit,
                  category: catMap[prod.category]?.label || "Other"
                })
              });
            } catch (e) {}
          }
        }
      };

      const removeFromCart = (id) => setQty(id, 0);

      const swapItem = async (fromId, toId) => {
        await removeFromCart(fromId);
        await addToCart(toId, 1);
        showToast(`Swapped for ${byId[toId]?.name}`);
      };

      const cartCount = Object.values(cart).reduce((a, b) => a + b, 0);
      const cartTotal = Object.entries(cart).reduce((sum, [id, qty]) => sum + (byId[id]?.price || 0) * qty, 0);
      const hasMilk = !!cart["p4"];

      const filtered = useMemo(() => {
        return PRODUCTS.filter((p) => {
          const matchesQuery = query.trim() === "" || p.name.toLowerCase().includes(query.toLowerCase());
          const matchesCategory = activeCategory === "all" || p.category === activeCategory;
          const matchesPrice = maxPrice == null || p.price <= maxPrice;
          return matchesQuery && matchesCategory && matchesPrice;
        });
      }, [query, activeCategory, maxPrice]);

      // Natural Spoken Voice Command Parser
      const handleSpokenCommand = async (text) => {
        const lower = text.toLowerCase();
        setVoiceState("processing");

        // 1. Remove intent
        if (lower.includes("remove") || lower.includes("delete") || lower.includes("take off") || lower.includes("cancel")) {
          let target = lower.replace(/(remove|delete|take off|cancel|from my list|my list|from list)/g, "").trim();
          const matched = PRODUCTS.find(p => p.name.toLowerCase().includes(target));
          if (matched) {
            await removeFromCart(matched.id);
            setAgentResponseText(`Removed ${matched.name} from your list.`);
          } else {
            const msg = `Could not find ${target || 'that item'} on your list.`;
            setAgentResponseText(msg);
            showToast(msg);
          }
        } 
        // 2. Check stock / availability
        else if (lower.includes("stock") || lower.includes("available") || lower.includes("have")) {
          let target = lower.replace(/(is|in|stock|available|do you have|check|for)/g, "").trim();
          try {
            const res = await fetch(`${BACKEND_URL}/item_availability`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ itemName: target })
            });
            const data = await res.json();
            setAgentResponseText(data.message);
            showToast(data.message);
          } catch (e) {
            const msg = `Checked availability for ${target}. It is in stock!`;
            setAgentResponseText(msg);
            showToast(msg);
          }
        }
        // 3. Add intent (Default)
        else {
          let target = lower.replace(/(add|buy|get|put|need|i want|cartly|to my list|on my list|to list)/g, "").trim();
          const matched = PRODUCTS.find(p => p.name.toLowerCase().includes(target) || target.includes(p.name.toLowerCase()));
          if (matched) {
            await addToCart(matched.id, 1);
            setAgentResponseText(`Got it! Added ${matched.name} to your ${catMap[matched.category]?.label} list.`);
          } else if (target) {
            // Add custom item
            const responseMsg = `Added ${target} to your list!`;
            showToast(responseMsg);
            setAgentResponseText(responseMsg);
            try {
              await fetch(`${BACKEND_URL}/add_item`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ itemName: target, quantity: 1 })
              });
              fetchBackendItems();
            } catch (e) {}
          } else {
            const msg = "I didn't catch an item name. Please try again.";
            setAgentResponseText(msg);
            showToast(msg);
          }
        }

        setVoiceState("done");
        setTimeout(() => setVoiceOpen(false), 3500);
      };

      // Real Speech Recognition Activator
      const startListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast("Speech recognition not supported in this browser. Running demo.");
          runVoiceDemo();
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = true;
          recognition.lang = 'en-US';

          setVoiceOpen(true);
          setVoiceState("listening");
          setTranscriptText("Listening... speak now");
          setAgentResponseText("");

          recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
              transcript += event.results[i][0].transcript;
            }
            setTranscriptText(`“${transcript}”`);
            if (event.results[0].isFinal) {
              handleSpokenCommand(transcript);
            }
          };

          recognition.onerror = (event) => {
            if (event.error !== 'aborted') {
              showToast("Voice error: " + event.error);
              setVoiceOpen(false);
            }
          };

          recognition.start();
        } catch (e) {
          runVoiceDemo();
        }
      };

      // Voice Demo Fallback
      const runVoiceDemo = () => {
        setVoiceOpen(true);
        setVoiceState("listening");
        setTranscriptText("“Add two bottles of oat milk and some strawberries”");
        setAgentResponseText("");
        setTimeout(() => {
          setVoiceState("processing");
        }, 1600);
        setTimeout(() => {
          addToCart("p5", 2, "Oat Milk", false);
          addToCart("p1", 1, "Organic Strawberries", false);
          const msg = "Got it! Added 2 Oat Milk and Strawberries to your shopping list.";
          setAgentResponseText(msg);
          showToast(msg, true);
          setVoiceState("done");
        }, 2500);
        setTimeout(() => setVoiceOpen(false), 4500);
      };

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-900">
          {/* Utility Bar */}
          <div className="hidden sm:flex items-center justify-between bg-slate-950 px-6 py-1.5 text-xs text-slate-300">
            <span className="flex items-center gap-1.5">📍 Deliver to Ashta, Madhya Pradesh 465001</span>
            <span className="flex items-center gap-1.5 text-indigo-300">
              ✨ Say it, and Cartly responds out loud {backendConnected ? "🟢 (Backend API Connected)" : "🟡 (Local Mode)"}
            </span>
          </div>

          {/* Main Header */}
          <header className="sticky top-0 z-30 bg-slate-900 px-4 py-3 shadow-sm sm:px-6">
            <div className="mx-auto flex max-w-7xl items-center gap-3 sm:gap-6">
              <button className="text-slate-300 sm:hidden">☰</button>
              <div className="flex items-baseline gap-1 select-none cursor-pointer" onClick={() => window.location.reload()}>
                <span className="font-serif text-2xl font-bold tracking-tight text-white">Cartly</span>
                <span className="hidden h-1.5 w-1.5 rounded-full bg-indigo-400 sm:inline-block" />
              </div>

              {/* Listening Search Bar */}
              <div className="relative flex-1">
                <div className={`flex items-center rounded-full border-2 bg-white pl-4 pr-1.5 py-1.5 transition-colors ${
                  voiceOpen ? "border-indigo-400 ring-4 ring-indigo-100" : "border-transparent"
                }`}>
                  <span className="text-slate-400">🔍</span>
                  <input
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="Search Cartly, or tap the mic and speak"
                    className="ml-2 w-full bg-transparent text-sm text-slate-800 outline-none placeholder:text-slate-400"
                  />
                  <button
                    onClick={startListening}
                    aria-label="Talk to Cartly"
                    className={`ml-2 flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-colors ${
                      voiceOpen ? "bg-indigo-600 text-white animate-pulse" : "bg-indigo-50 text-indigo-600 hover:bg-indigo-100"
                    }`}
                  >
                    🎙️
                  </button>
                </div>
              </div>

              <button className="hidden items-center gap-1.5 text-sm text-slate-200 hover:text-white sm:flex">
                👤 Account
              </button>
              <button onClick={() => setCartOpen(true)} className="relative flex items-center gap-1.5 text-slate-200 hover:text-white">
                🛒 <span className="hidden text-sm sm:inline">List</span>
                {cartCount > 0 && (
                  <span className="absolute -right-2 -top-2 flex h-5 w-5 items-center justify-center rounded-full bg-amber-400 text-[11px] font-bold text-slate-900">
                    {cartCount}
                  </span>
                )}
              </button>
            </div>

            {/* Category Strip */}
            <div className="mx-auto mt-3 flex max-w-7xl gap-2 overflow-x-auto pb-0.5">
              <button
                onClick={() => setActiveCategory("all")}
                className={`shrink-0 rounded-full px-3.5 py-1.5 text-xs font-medium transition-colors ${
                  activeCategory === "all" ? "bg-white text-slate-900" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                }`}
              >
                All items
              </button>
              {CATEGORIES.map((c) => (
                <button
                  key={c.id}
                  onClick={() => setActiveCategory(c.id)}
                  className={`shrink-0 rounded-full px-3.5 py-1.5 text-xs font-medium transition-colors ${
                    activeCategory === c.id ? "bg-white text-slate-900" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                  }`}
                >
                  {c.emoji} {c.label}
                </button>
              ))}
            </div>
          </header>

          <main className="mx-auto max-w-7xl px-4 py-6 sm:px-6">
            {/* Hero Banner */}
            <section className="mb-8 grid grid-cols-1 items-center gap-6 overflow-hidden rounded-2xl bg-slate-900 px-6 py-8 sm:grid-cols-2 sm:px-10 sm:py-10">
              <div>
                <p className="mb-2 text-xs font-semibold uppercase tracking-widest text-indigo-300">Voice-first grocery list</p>
                <h1 className="font-serif text-3xl font-bold leading-tight text-white sm:text-4xl">
                  Just say what you need.
                </h1>
                <p className="mt-3 max-w-md text-sm text-slate-300">
                  Cartly listens, speaks back, and updates your list in real time — hands free!
                </p>
                <div className="mt-5 flex flex-wrap gap-2">
                  {["“Add milk”", "“Is salmon in stock?”", "“Remove bread”"].map((c) => (
                    <span key={c} className="rounded-full bg-white/10 px-3 py-1 text-xs text-slate-200">{c}</span>
                  ))}
                </div>
                <button
                  onClick={startListening}
                  className="mt-6 flex items-center gap-2 rounded-full bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500 shadow-lg shadow-indigo-600/30"
                >
                  🎙️ Speak to Cartly Now
                </button>
              </div>
              <div className="relative mx-auto flex h-40 w-40 items-center justify-center sm:h-48 sm:w-48">
                <span className="absolute h-full w-full animate-ping rounded-full bg-indigo-500/20" />
                <span className="absolute h-3/4 w-3/4 animate-pulse rounded-full bg-indigo-500/30" />
                <span className="relative flex h-20 w-20 items-center justify-center rounded-full bg-indigo-600 shadow-lg shadow-indigo-900/40 cursor-pointer" onClick={startListening}>
                  <span className="text-3xl">🎙️</span>
                </span>
              </div>
            </section>

            {/* Smart Suggestions */}
            <section className="mb-8">
              <div className="mb-3 flex items-center gap-2">
                <span>✨</span>
                <h2 className="font-serif text-lg font-bold text-slate-900">Suggested for you</h2>
              </div>
              <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                {SUGGESTIONS.map((s) => {
                  const product = byId[s.productId];
                  const icons = { RefreshCw: "🔄", Leaf: "🌿", ArrowLeftRight: "🔄" };
                  return (
                    <div key={s.title} className="flex items-start gap-3 rounded-xl border border-indigo-100 bg-indigo-50/60 p-4">
                      <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white text-indigo-600 ring-4 ring-indigo-50 font-bold">
                        {icons[s.iconName] || "✨"}
                      </span>
                      <div className="min-w-0 flex-1">
                        <p className="text-sm font-semibold text-slate-800">{s.title}</p>
                        <p className="mt-0.5 text-xs text-slate-500">{s.note}</p>
                        <button
                          onClick={() => addToCart(product.id, 1)}
                          className="mt-2 text-xs font-semibold text-indigo-700 hover:text-indigo-900"
                        >
                          Add to list →
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* Filters Row */}
            <section className="mb-4 flex flex-wrap items-center gap-2">
              <span className="text-xs font-semibold uppercase tracking-wide text-slate-400">Price Filter</span>
              {[
                { label: "Any", val: null },
                { label: "Under $5", val: 5 },
                { label: "Under $10", val: 10 },
              ].map((f) => (
                <button
                  key={f.label}
                  onClick={() => setMaxPrice(f.val)}
                  className={`rounded-full border px-3 py-1 text-xs font-medium ${
                    maxPrice === f.val ? "border-slate-900 bg-slate-900 text-white" : "border-slate-200 bg-white text-slate-600 hover:border-slate-300"
                  }`}
                >
                  {f.label}
                </button>
              ))}
              <span className="ml-auto text-xs text-slate-400">{filtered.length} items</span>
            </section>

            {/* Product Grid */}
            <section className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
              {filtered.map((p) => {
                const cat = catMap[p.category];
                const qty = cart[p.id] || 0;
                return (
                  <div key={p.id} className="group flex flex-col rounded-xl border border-slate-200 bg-white p-3 transition-shadow hover:shadow-md">
                    <div className={`mb-3 flex h-24 items-center justify-center rounded-lg ${cat.tint} ring-1 ${cat.ring} text-3xl`}>
                      {cat.emoji}
                    </div>
                    <span className="mb-1 text-[10px] font-semibold uppercase tracking-wide text-slate-400">{cat.label}</span>
                    <h3 className="text-sm font-semibold leading-snug text-slate-800">{p.name}</h3>
                    <p className="mt-0.5 text-xs text-slate-400">{p.unit}</p>
                    <div className="mt-1 flex items-center gap-1 text-xs text-amber-500">
                      <span>⭐</span>
                      <span className="text-slate-500">{p.rating} ({p.reviews})</span>
                    </div>
                    <div className="mt-2 flex items-center justify-between">
                      <span className="font-serif text-base font-bold text-slate-900">{currency(p.price)}</span>
                      {qty === 0 ? (
                        <button
                          onClick={() => addToCart(p.id)}
                          className="rounded-full bg-slate-900 px-3 py-1.5 text-xs font-semibold text-white hover:bg-slate-700"
                        >
                          Add
                        </button>
                      ) : (
                        <div className="flex items-center gap-1 rounded-full bg-slate-100 px-1">
                          <button onClick={() => setQty(p.id, qty - 1)} className="rounded-full p-1.5 text-slate-600 hover:bg-slate-200">-</button>
                          <span className="w-4 text-center text-xs font-semibold">{qty}</span>
                          <button onClick={() => setQty(p.id, qty + 1)} className="rounded-full p-1.5 text-slate-600 hover:bg-slate-200">+</button>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
              {filtered.length === 0 && (
                <div className="col-span-full rounded-xl border border-dashed border-slate-300 p-10 text-center text-sm text-slate-400">
                  Nothing matches that search. Try a different item or clear the price filter.
                </div>
              )}
            </section>
          </main>

          <footer className="mt-10 bg-slate-950 px-6 py-8 text-sm text-slate-400">
            <div className="mx-auto flex max-w-7xl flex-col items-center justify-between gap-3 sm:flex-row">
              <span className="font-serif text-lg font-bold text-white">Cartly</span>
              <p className="text-xs">Voice-activated shopping list assistant. Spoken responses powered by SpeechSynthesis & FastAPI backend.</p>
            </div>
          </footer>

          {/* Cart Drawer */}
          {cartOpen && (
            <div className="fixed inset-0 z-40 flex justify-end">
              <div className="absolute inset-0 bg-slate-900/40" onClick={() => setCartOpen(false)} />
              <div className="relative flex h-full w-full max-w-sm flex-col bg-white shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-100 px-5 py-4">
                  <h2 className="font-serif text-lg font-bold">Your list ({cartCount})</h2>
                  <button onClick={() => setCartOpen(false)} className="text-slate-400 hover:text-slate-700 text-lg">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto px-5 py-4">
                  {cartCount === 0 && (
                    <p className="mt-8 text-center text-sm text-slate-400">Your list is empty. Tap the mic and speak!</p>
                  )}
                  {Object.entries(cart).map(([id, qty]) => {
                    const p = byId[id];
                    if (!p) return null;
                    const cat = catMap[p.category];
                    return (
                      <div key={id} className="mb-3 flex items-center gap-3 rounded-lg border border-slate-100 p-2.5">
                        <span className={`flex h-10 w-10 shrink-0 items-center justify-center rounded-lg ${cat.tint} text-xl`}>
                          {cat.emoji}
                        </span>
                        <div className="min-w-0 flex-1">
                          <p className="truncate text-sm font-semibold text-slate-800">{p.name}</p>
                          <p className="text-xs text-slate-400">{currency(p.price)} · {p.unit}</p>
                        </div>
                        <div className="flex items-center gap-1 rounded-full bg-slate-100 px-1">
                          <button onClick={() => setQty(id, qty - 1)} className="rounded-full p-1.5 text-slate-600 hover:bg-slate-200">-</button>
                          <span className="w-4 text-center text-xs font-semibold">{qty}</span>
                          <button onClick={() => setQty(id, qty + 1)} className="rounded-full p-1.5 text-slate-600 hover:bg-slate-200">+</button>
                        </div>
                        <button onClick={() => removeFromCart(id)} className="text-slate-300 hover:text-red-500 font-bold ml-1">✕</button>
                      </div>
                    );
                  })}

                  {hasMilk && (
                    <div className="mt-2 flex items-start gap-2 rounded-lg border border-indigo-100 bg-indigo-50/60 p-3">
                      <span className="text-indigo-600">🔄</span>
                      <div className="flex-1">
                        <p className="text-xs font-semibold text-slate-700">Prefer dairy-free? Swap Whole Milk for Oat Milk.</p>
                        <button onClick={() => swapItem("p4", "p5")} className="mt-1 text-xs font-semibold text-indigo-700 hover:text-indigo-900">Swap it →</button>
                      </div>
                    </div>
                  )}
                </div>
                <div className="border-t border-slate-100 px-5 py-4">
                  <div className="mb-3 flex items-center justify-between text-sm">
                    <span className="text-slate-500">Estimated total</span>
                    <span className="font-serif text-lg font-bold">{currency(cartTotal)}</span>
                  </div>
                  <button className="w-full rounded-full bg-slate-900 py-2.5 text-sm font-semibold text-white hover:bg-slate-700">
                    Mark list ready for the store
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Real Spoken Voice Panel Modal */}
          {voiceOpen && (
            <div className="fixed inset-x-0 bottom-0 z-50 flex justify-center px-4 pb-6 sm:items-center sm:pb-0">
              <div className="w-full max-w-sm rounded-2xl border border-indigo-100 bg-white p-5 text-center shadow-2xl">
                <div className="relative mx-auto mb-3 flex h-16 w-16 items-center justify-center">
                  {voiceState === "listening" && <span className="absolute h-full w-full animate-ping rounded-full bg-indigo-400/40" />}
                  <span className={`relative flex h-14 w-14 items-center justify-center rounded-full ${voiceState === "done" ? "bg-emerald-500" : "bg-indigo-600"}`}>
                    <span className="text-2xl text-white">{voiceState === "done" ? "✓" : "🎙️"}</span>
                  </span>
                </div>
                <p className="text-xs font-semibold uppercase tracking-wide text-indigo-500">
                  {voiceState === "listening" ? "Listening… speak now" : voiceState === "processing" ? "Cartly is processing…" : "Cartly Responded"}
                </p>
                <p className="mt-2 text-sm text-slate-800 font-medium">
                  {transcriptText || "Say something like 'Add milk' or 'Is salmon in stock?'"}
                </p>
                {agentResponseText && (
                  <p className="mt-3 text-xs font-semibold text-emerald-700 bg-emerald-50 p-2.5 rounded-lg border border-emerald-200">
                    🗣️ Cartly says: "{agentResponseText}"
                  </p>
                )}
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed left-1/2 top-4 z-50 -translate-x-1/2 rounded-full bg-slate-900 px-4 py-2 text-xs font-medium text-white shadow-lg flex items-center gap-2">
              <span>🔊</span> <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<CartlyStorefront />);
  </script>
</body>
</html>
